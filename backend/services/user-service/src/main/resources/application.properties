spring.application.name=user-service
server.port=8084

# H2 Database Configuration
spring.datasource.url=jdbc:h2:file:./services/user-service/src/main/resources/userdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Data Initialization
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Kafka Configuration for Kafka 2.13-3.7.2
spring.cloud.stream.kafka.binder.brokers=localhost:9092
spring.cloud.stream.kafka.binder.zk-nodes=localhost:2181

# Event Topics Configuration - DDD Bounded Context Events
spring.cloud.stream.bindings.userEvents-out-0.destination=user-events
spring.cloud.stream.bindings.userEvents-out-0.content-type=application/json
spring.cloud.stream.bindings.userEvents-in-0.destination=user-events
spring.cloud.stream.bindings.userEvents-in-0.group=user-service-group

spring.cloud.stream.bindings.messagingEvents-out-0.destination=messaging-events
spring.cloud.stream.bindings.messagingEvents-out-0.content-type=application/json
spring.cloud.stream.bindings.messagingEvents-in-0.destination=messaging-events
spring.cloud.stream.bindings.messagingEvents-in-0.group=user-service-group

spring.cloud.stream.bindings.statusEvents-out-0.destination=status-events
spring.cloud.stream.bindings.statusEvents-out-0.content-type=application/json
spring.cloud.stream.bindings.statusEvents-in-0.destination=status-events
spring.cloud.stream.bindings.statusEvents-in-0.group=user-service-group

# Allow bean definition overriding to resolve repository conflicts
spring.main.allow-bean-definition-overriding=true

# Service Integration Configuration - Direct HTTP Communication
ordering-service.base-url=http://localhost:8082
restaurant-service.base-url=http://localhost:8081
logistics-service.base-url=http://localhost:8083

# Jackson Configuration - Enable Java 8 time support
spring.jackson.serialization.write-dates-as-timestamps=false